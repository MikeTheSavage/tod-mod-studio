; tod_mempool.ini - settings for the mempool dinput8.dll patcher (put both next to TOD.exe in a TEST copy of the game).
; 0 = leave the original value. Sizes in MiB. Everything is checked against the original bytes before writing.
[mempool]
; ALLOCATOR_MAIN_ASSETS: main + map + submap INFO and the scene graph. Original 90. Vanilla peak ~41, TOD HD peak 78.6.
main_mb = 256
; ALLOCATOR_RENDERLIST: display lists (dropped silently when full), quadtree nodes, per-block payload staging. Original 10.
renderlist_mb = 0
; ALLOCATOR_MISSION_ASSETS / PLAYER_DATA / CUTSCENE_OR_REWIND. Originals 7 / 3 / 2.
mission_mb = 0
player_mb = 0
cutscene_mb = 0
; Scene quadtree node pools (32 B each, taken from RENDERLIST; u16 index so at most 65534). Originals 10000 / 12200.
quadtree_main = 0
quadtree_aux = 0
; Log a full Frame pool (name, request, fill) at 0x47A5E4 before the engine dereferences the NULL it gets. 1 = on.
overflow_log = 1
; Log pool fill and free address space every monitor_s seconds (only when something changed).
monitor = 1
monitor_s = 5
; LAA test: with a LARGE_ADDRESS_AWARE TOD.exe, reserve the free space below 2 GB at startup (leaving stress_slack_mb)
; so the CRT heap, the pools and D3D allocations land above 0x80000000. Ignored for a non-LAA exe.
laa_stress = 0
stress_slack_mb = 96
